# Testes do Siloé a cada envio: confere se todo .js abre sem erro e roda os testes num Chrome sem tela.
# (A trava completa, que só publica se passar, está pronta: falta trocar Settings → Pages → Source para "GitHub Actions".)
name: Testar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir se os arquivos .js abrem sem erro
        run: for f in *.js; do node --check "$f" || exit 1; done
      - name: Instalar o Chrome dos testes
        run: npm install --no-save --no-package-lock puppeteer@23.11.1
      - name: Rodar os testes
        run: |
          python3 -m http.server 5500 >/dev/null 2>&1 &
          sleep 2
          node testes/rodar.mjs

