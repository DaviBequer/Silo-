<!-- APP PONTO PJ: Controle de horas e valor -->
<div class="ponto-app">
  <div class="card">
    <div class="card-title">
      <div class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
      <div style="display:flex;gap:6px">
        <button class="btn-icon-sm" onclick="PontoApp.openSettings()" title="Configurações"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/></svg></button>
        <button class="btn-icon-sm" onclick="PontoApp.exportPDF()" title="Exportar PDF"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button>
      </div>
    </div>

    <div class="ponto-summary">
      <div class="summary-grid">
        <div class="summary-item"><div class="label">Total de Horas</div><div class="value" id="pontoTotalHoras">00:00</div></div>
        <div class="summary-item"><div class="label">Valor a Receber</div><div class="value" id="pontoValorReceber">R$ 0,00</div></div>
      </div>
      <div class="comparacao">
        <div><div class="comp-label">Padrão</div><div class="comp-value" id="pontoPadrao">00:00</div></div>
        <div><div class="comp-label">Diferença</div><div class="comp-value" id="pontoDiferenca">00:00</div></div>
        <div><div class="comp-label">Impacto</div><div class="comp-value" id="pontoImpacto">R$ 0,00</div></div>
      </div>
    </div>

    <div class="ponto-compare" id="pontoCompareStrip"></div>

    <div class="ponto-mes-nav">
      <button onclick="PontoApp.navMes(-1)">◀</button>
      <div class="mes-label" id="pontoMesLabel"></div>
      <button onclick="PontoApp.navMes(1)">▶</button>
    </div>

    <div class="field" style="margin-bottom:14px">
      <label>Valor da Hora</label>
      <input type="text" id="pontoValorHora" placeholder="0,00" inputmode="numeric" oninput="Utils.maskMoneyInput(this); PontoApp.onValorHoraChange(this.value)">
    </div>

    <div id="pontoDiasLista" class="ponto-dias-lista"></div>
  </div>
</div>
