<!-- APP PANORAMA: Visão geral financeira -->
<div class="panorama-app">
  <div class="card card-flat">
    <div class="card-title"><div class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8 10 1 17"/><polyline points="17 6 23 6 23 12"/></svg></div></div>
    <div class="pano-nav">
      <button class="pano-nav-btn" onclick="PanoramaApp.shiftWindow(-1)">◀</button>
      <div class="pano-nav-label" id="panoWindowLabel"></div>
      <button class="pano-nav-btn" onclick="PanoramaApp.shiftWindow(1)">▶</button>
    </div>
    <table class="compact-table" id="acumTable">
      <thead>
        <tr><th style="text-align:left;padding-left:8px">Mês</th><th>Sobra</th><th>Acumulado</th></tr>
      </thead>
      <tbody id="acumTableBody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-title"><div class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div>
    <div class="summary-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="summary-item"><div class="label" style="font-size:11px;color:var(--slate-500);text-transform:uppercase;font-weight:700">Total de Horas</div><div class="value" id="panoPontoHoras">00:00</div></div>
      <div class="summary-item"><div class="label" style="font-size:11px;color:var(--slate-500);text-transform:uppercase;font-weight:700">Valor a Receber</div><div class="value" id="panoPontoValor">R$ 0,00</div></div>
    </div>
    <div class="meta" id="panoPontoComparativo" style="margin-top:10px;color:var(--slate-500)"></div>
  </div>

  <div class="user-section" id="panoUserSection"></div>

  <div class="card" style="background:linear-gradient(160deg,var(--primary),var(--primary-dim));text-align:center;padding:24px;margin-bottom:var(--s4);position:relative;overflow:hidden;box-shadow:var(--shadow-lg);border-radius:var(--radius-md);border:none">
    <div class="hero-inline-title" style="color:#fff;justify-content:center;position:relative;z-index:1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg> Simule seu orçamento</div>
    <div style="font-size:12.5px;color:rgba(255,255,255,.8);margin-bottom:16px;position:relative;z-index:1">Descubra como suas metas impactam o fluxo</div>
    <button class="btn" style="background:#fff;color:var(--primary);position:relative;z-index:1" onclick="PanoramaApp.openSimulator()">Gerar Orçamento</button>
  </div>

  <div class="card">
    <div class="card-title"><div class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div>
    <div id="sumarioPanorama" class="summary-list"></div>
  </div>

  <div class="card">
    <div class="card-title"><div class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div></div>
    <div class="checklist" id="contasChecklist"></div>
  </div>
</div>
