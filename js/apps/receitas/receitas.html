<!-- APP RECEITAS: Template -->
<div class="receita-app">
  <div class="receitas-header">
    <div class="receitas-search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="receitaSearchInput" placeholder="Buscar por nome, ingrediente ou categoria..." oninput="ReceitasApp.onSearch(this.value)">
      <button id="receitaSearchClear" onclick="ReceitasApp.clearSearch()" style="display:none">✕</button>
    </div>
    <div class="receita-filter-chips" id="receitaFilterChips"></div>
  </div>

  <div id="receitaGrid" class="receita-grid"></div>

  <button class="receita-fab" onclick="ReceitasApp.openForm()" title="Nova Receita" aria-label="Nova Receita">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>

  <!-- MODAL: Nova Categoria -->
  <div class="modal-overlay" id="modalReceitaCategoria">
    <div class="modal">
      <div class="modal-header">
        <h3>Nova Categoria</h3>
        <button class="modal-close" onclick="ReceitasApp.closeModal('modalReceitaCategoria')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="field full">
        <label>Nome da Categoria</label>
        <input type="text" id="receitaCategoriaNome" placeholder="Ex: Sobremesa, Salgado, Bebida...">
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-block" onclick="ReceitasApp.closeModal('modalReceitaCategoria')">Cancelar</button>
        <button class="btn btn-block" onclick="ReceitasApp.saveCategory()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- FULLPAGE: Detalhes da Receita -->
  <div class="fullpage" id="pageReceitaDetalhe">
    <div class="fullpage-header receita-detalhe-header">
      <button class="header-btn" onclick="ReceitasApp.closeDetalhe()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="fullpage-title" id="receitaDetalheHeaderTitle" style="opacity:0"></div>
      <button class="header-btn" id="receitaDetalheMenuBtn" onclick="ReceitasApp.toggleMenu()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
      <div class="receita-menu-dropdown" id="receitaDetalheMenuDropdown" style="display:none">
        <button onclick="ReceitasApp.shareRecipe()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Compartilhar</button>
        <button onclick="ReceitasApp.editRecipe()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Editar</button>
        <button onclick="ReceitasApp.deleteRecipe()" style="color:var(--danger)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> Excluir</button>
      </div>
    </div>
    <div class="fullpage-content" style="padding:0" id="receitaDetalheConteudo"></div>
  </div>

  <!-- FULLPAGE: Formulário -->
  <div class="fullpage" id="pageReceitaForm">
    <div class="fullpage-header">
      <button class="header-btn" onclick="ReceitasApp.closeForm()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="fullpage-title" id="receitaFormTitulo">Nova Receita</div>
      <button class="header-btn" id="receitaFormFavBtn" onclick="ReceitasApp.toggleFav()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </button>
    </div>
    <div class="fullpage-content">
      <input type="hidden" id="receitaId">
      <form id="receitaForm" onsubmit="event.preventDefault(); ReceitasApp.saveRecipe();">
        <!-- Foto -->
        <div class="receita-form-section">
          <div class="receita-form-foto-wrap">
            <div id="receitaFotoPreview" class="receita-form-foto"></div>
            <div class="receita-foto-fabs">
              <label class="receita-foto-fab" title="Escolher da galeria">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <input type="file" accept="image/*" style="display:none" onchange="ReceitasApp.onFotoSelected(event)">
              </label>
              <button type="button" class="receita-foto-fab" onclick="ReceitasApp.removeFoto()" title="Remover foto">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Info básica -->
        <div class="receita-form-section">
          <div class="field full">
            <label>Nome da Receita</label>
            <input type="text" id="receitaNome" placeholder="Ex: Bolo de Cenoura" required>
          </div>
          <div class="field full">
            <label>Categoria</label>
            <div class="cat-picker">
              <button type="button" class="cat-picker-btn" id="receitaCatPickerBtn" onclick="ReceitasApp.toggleCatPicker()">Sem categoria</button>
              <div class="cat-picker-panel" id="receitaCatPickerPanel" style="display:none">
                <div class="cat-picker-grid" id="receitaCatPickerGrid"></div>
                <div class="cat-picker-nova">
                  <input type="text" id="receitaCatNovaInput" placeholder="Nova categoria...">
                  <button type="button" class="btn-icon-sm" onclick="ReceitasApp.createCategoryInline()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                </div>
              </div>
            </div>
            <input type="hidden" id="receitaCategoriaSelect">
          </div>
          <div class="receita-form-row2">
            <div class="field">
              <label>Tempo de Preparo</label>
              <input type="text" id="receitaTempo" placeholder="Ex: 40 min">
            </div>
            <div class="field">
              <label>Porções</label>
              <input type="number" id="receitaPorcoes" min="1" placeholder="Ex: 4">
            </div>
          </div>
        </div>

        <!-- Dificuldade e cor -->
        <div class="receita-form-section">
          <div class="field full">
            <label>Dificuldade</label>
            <div class="dificuldade-chips" id="receitaDificuldadeChips">
              <button type="button" class="dif-chip" data-val="facil" onclick="ReceitasApp.setDificuldade('facil')">Fácil</button>
              <button type="button" class="dif-chip" data-val="media" onclick="ReceitasApp.setDificuldade('media')">Média</button>
              <button type="button" class="dif-chip" data-val="dificil" onclick="ReceitasApp.setDificuldade('dificil')">Difícil</button>
            </div>
            <input type="hidden" id="receitaDificuldade">
          </div>
          <div class="field full">
            <label>Cor da Receita (opcional)</label>
            <div class="cor-chips" id="receitaCorChips"></div>
            <input type="hidden" id="receitaCor">
          </div>
        </div>

        <!-- Ingredientes -->
        <div class="receita-form-section">
          <div class="field full">
            <label>Ingredientes</label>
            <div id="receitaIngredientesLista" class="receita-ing-lista"></div>
            <button type="button" class="btn btn-sm btn-outline btn-block" style="margin-top:8px" onclick="ReceitasApp.addIngredient()">+ Adicionar Ingrediente</button>
          </div>
        </div>

        <!-- Modo de preparo -->
        <div class="receita-form-section">
          <div class="field full">
            <label>Modo de Preparo</label>
            <div id="receitaPassosLista" class="receita-passos-lista"></div>
            <button type="button" class="btn btn-sm btn-outline btn-block" style="margin-top:8px" onclick="ReceitasApp.addPasso()">+ Adicionar Passo</button>
          </div>
        </div>

        <!-- Observações -->
        <div class="receita-form-section">
          <div class="field full">
            <label>Observações (opcional)</label>
            <textarea id="receitaObservacoes" rows="3" placeholder="Dicas, substituições, observações..."></textarea>
          </div>
        </div>

        <button type="submit" class="receita-salvar-fab" title="Salvar Receita" aria-label="Salvar Receita">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
        <div style="height:80px"></div>
      </form>
    </div>
  </div>
</div>
