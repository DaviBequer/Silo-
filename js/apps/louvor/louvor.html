<!-- APP LOUVOR: Biblioteca de louvores -->
<div class="louvor-app">
  <div class="receitas-header">
    <div class="receitas-search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="louvorSearchInput" placeholder="Buscar por título ou artista..." oninput="LouvorApp.onSearch(this.value)">
      <button id="louvorSearchClear" onclick="LouvorApp.clearSearch()" style="display:none">✕</button>
    </div>
    <div class="receita-filter-chips" id="louvorFilterChips"></div>
  </div>

  <div id="louvorLista" class="lv-lista"></div>

  <button class="receita-fab" onclick="LouvorApp.openForm()" title="Novo Louvor" aria-label="Novo Louvor">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>

  <!-- FULLPAGE: Detalhe -->
  <div class="fullpage" id="pageLouvorDetalhe">
    <div class="fullpage-header">
      <button class="header-btn" onclick="LouvorApp.closeDetalhe()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="fullpage-title" id="louvorDetalheTitle"></div>
      <button class="header-btn" onclick="LouvorApp.deleteLouvore()" style="color:var(--danger);border-color:var(--danger-tint)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>
    <div class="fullpage-content" id="louvorDetalheConteudo"></div>
  </div>

  <!-- FULLPAGE: Formulário -->
  <div class="fullpage" id="pageLouvorForm">
    <div class="fullpage-header">
      <button class="header-btn" onclick="LouvorApp.closeForm()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="fullpage-title">Novo Louvor</div>
      <div style="width:28px"></div>
    </div>
    <div class="fullpage-content">
      <form id="louvorForm" onsubmit="event.preventDefault(); LouvorApp.saveLouvore();">
        <div class="field full">
          <label>Título</label>
          <input type="text" id="lvTitulo" placeholder="Nome do louvor" required>
        </div>
        <div class="field full">
          <label>Artista</label>
          <input type="text" id="lvArtista" placeholder="Artista / Autor">
        </div>
        <div class="field full">
          <label>Categoria</label>
          <div class="dificuldade-chips" id="lvCategoriaChips"></div>
          <input type="hidden" id="lvCategoriaSelect">
        </div>
        <div class="field full">
          <label>Tom (ex: C, G, Am)</label>
          <input type="text" id="lvTom" placeholder="Tom">
        </div>
        <div class="field full">
          <label>Letra</label>
          <textarea id="lvConteudo" rows="10" placeholder="[Primeira Parte]\nE\nTenho uma palavra..."></textarea>
        </div>
        <button type="submit" class="receita-salvar-fab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg>
        </button>
        <div style="height:80px"></div>
      </form>
    </div>
  </div>
</div>
