<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Copiar horários</title>
<link rel="icon" href="icon-192.png">
<style>
  /* Página aberta pelo botão "Copiar para planilha" do PDF do ponto.
     Copia os horários com TAB entre as colunas e quebra de linha entre os dias:
     colando numa célula do Excel/Google Planilhas, cada dia vai para uma linha e cada horário para uma coluna.
     Os horários vêm no próprio link (depois do #) — não passam por servidor nem banco. */
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F6F7F9;color:#0F172A;font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif}
  .card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
  .sub{font-size:13px;color:#55627A;margin-bottom:18px}
  button{width:100%;border:none;border-radius:14px;padding:18px;background:#0F172A;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  button.ok{background:#15803D}
  .dica{font-size:12.5px;color:#55627A;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="sub" id="sub"></div>
  <button id="btn">Copiar horários</button>
  <div class="dica">Na planilha, clique <b>uma vez</b> na célula da Entrada do primeiro dia e cole (Ctrl+V).</div>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.hash.replace(/^#/, ''));
  var dados = p.get('h') || '';
  var linhas = dados ? dados.split(';').map(function(l){ return l.split(','); }) : [];
  var sub = document.getElementById('sub'), btn = document.getElementById('btn');
  if(!linhas.length){ sub.textContent = 'Link sem horários. Abra pelo botão do PDF.'; btn.disabled = true; btn.style.opacity = .5; return; }
  var n = linhas.length;
  sub.textContent = (p.get('p') ? p.get('p') + ' · ' : '') + n + ' dia' + (n > 1 ? 's' : '');
  /* TAB entre colunas, quebra de linha entre dias (formato que as planilhas dividem sozinhas) */
  var texto = linhas.map(function(l){ return l.join('\t'); }).join('\r\n');
  function copiar(){
    var feito = function(){ btn.textContent = '✓ Copiado — agora é só colar'; btn.className = 'ok'; };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(texto).then(feito, alternativo);
    } else alternativo();
    function alternativo(){
      var ta = document.createElement('textarea'); ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); feito(); }catch(e){ btn.textContent = 'Não consegui copiar'; }
      ta.remove();
    }
  }
  btn.addEventListener('click', copiar);
})();
</script>
</body>
</html>
