<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2B3038">
  <meta name="description" content="Silo - App de finanças pessoais">
  
  <title>Silo</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Silo</span>
        </div>
        <button class="header-action" id="headerMenuBtn" onclick="toggleHeaderMenu()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"/>
            <circle cx="19" cy="12" r="1"/>
            <circle cx="5" cy="12" r="1"/>
          </svg>
        </button>
        <div class="header-menu" id="headerMenu" style="display:none">
          <button onclick="openSettings()">⚙️ Configurações</button>
          <button onclick="exportData()">📤 Exportar Dados</button>
          <button onclick="importData()">📥 Importar Dados</button>
          <button onclick="clearData()">🗑️ Limpar Tudo</button>
        </div>
      </div>
    </header>
    
    <!-- Conteúdo do App -->
    <main class="main-content">
      <div id="app-content"></div>
    </main>
    
    <!-- Navigation Bottom -->
    <nav class="bottom-nav"></nav>
    
    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>
  </div>
  
  <!-- Scripts -->
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
  
  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
  
  <!-- Header Menu Toggle -->
  <script>
    function toggleHeaderMenu() {
      const menu = document.getElementById('headerMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('headerMenu');
      const btn = document.getElementById('headerMenuBtn');
      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        menu.style.display = 'none';
      }
    });
    
    function openSettings() {
      Utils.showToast('Configurações - em breve');
    }
    
    function exportData() {
      const data = {
        planner: state.planner,
        ponto: state.ponto,
        receitas: state.receitas,
        louvor: state.louvor,
        mercado: state.mercado,
        tarefas: state.tarefas,
        exportedAt: new Date().toISOString()
      };
      
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `silo-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      
      Utils.showToast('Dados exportados');
      document.getElementById('headerMenu').style.display = 'none';
    }
    
    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.planner) state.planner = data.planner;
            if (data.ponto) state.ponto = data.ponto;
            if (data.receitas) state.receitas = data.receitas;
            if (data.louvor) state.louvor = data.louvor;
            if (data.mercado) state.mercado = data.mercado;
            if (data.tarefas) state.tarefas = data.tarefas;
            
            Storage.saveAll();
            Utils.showToast('Dados importados');
            location.reload();
          } catch (err) {
            Utils.showToast('Erro ao importar dados');
          }
        };
        reader.readAsText(file);
      };
      input.click();
      document.getElementById('headerMenu').style.display = 'none';
    }
    
    function clearData() {
      if (!confirm('Tem certeza? Todos os dados serão deletados!')) return;
      
      localStorage.clear();
      Utils.showToast('Dados limpos');
      setTimeout(() => location.reload(), 1500);
    }
  </script>
</body>
</html>
